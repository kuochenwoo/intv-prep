name: Publish preview update feed
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "An already published preview tag (drafts are refused)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: preview-update-feed
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch') || (startsWith(github.event.release.tag_name, 'v') && github.event.release.prerelease && !github.event.release.draft && contains(github.event.release.assets.*.name, 'latest.json')) }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: node tools/release/publish-feed.mjs
        env:
          GH_TOKEN: ${{ github.token }}

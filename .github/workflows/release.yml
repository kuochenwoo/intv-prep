name: Draft macOS preview
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing preview tag matching the application version"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: preview-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    permissions:
      contents: write
    uses: ./.github/workflows/build-preview.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

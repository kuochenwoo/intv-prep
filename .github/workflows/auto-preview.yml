name: Automatic preview release
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: automatic-preview-release
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - id: plan
        run: node tools/release/auto-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  release:
    needs: plan
    if: ${{ needs.plan.outputs.action == 'build' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-preview.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      publish: true
    secrets: inherit
  repair-feed:
    needs: plan
    if: ${{ needs.plan.outputs.action == 'feed' }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-update.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
